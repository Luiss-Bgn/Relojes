; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = wacho-final
boards_dir = ./board/LilyGoWatch-S3

; [platformio]
; src_dir = wacho5
; default_envs = twatch-s3
; boards_dir = ./board/LilyGoWatch-S3

[env]
lib_extra_dirs = .
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = app3M_littlefs_16MB.csv

[env:wacho-final]
build_src_filter = +<wacho_final/>
platform = espressif32@6.3.0
framework = arduino
board = LilyGoWatch-S3
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	;-DCONFIG_LITTLEFS_FOR_IDF_3_2
	-DCORE_DEBUG_LEVEL=3
	
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-Wnarrowing
	-include extras/Setup212_LilyGo_T_Watch_S3.h
	-DUSER_SETUP_LOADED
	
	-DRADIOLIB_EXCLUDE_NRF24
	-DRADIOLIB_EXCLUDE_RF69
	-DRADIOLIB_EXCLUDE_SX1231
	-DRADIOLIB_EXCLUDE_SI443X
	-DRADIOLIB_EXCLUDE_RFM2X
	-DRADIOLIB_EXCLUDE_SX127X
	-DRADIOLIB_EXCLUDE_AFSK
	-DRADIOLIB_EXCLUDE_AX25
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER
	-DRADIOLIB_EXCLUDE_MORSE
	-DRADIOLIB_EXCLUDE_RTTY
	-DRADIOLIB_EXCLUDE_SSTV
	-DRADIOLIB_EXCLUDE_DIRECT_RECEIVE
	-DRADIOLIB_EXCLUDE_APRS
	-DRADIOLIB_EXCLUDE_BELL
	
lib_deps = 
	earlephilhower/ESP8266Audio @ 1.9.7
	crankyoldgit/IRremoteESP8266 @ 2.8.6
	jgromes/RadioLib @ 7.1.0
	bodmer/TFT_eSPI @ 2.5.43
	lvgl/lvgl @ 8.4.0
	kosme/arduinoFFT @ 1.6
	lewisxhe/XPowersLib @ 0.2.4
	lewisxhe/SensorLib @ 0.1.8
	mikalhart/TinyGPSPlus @ ^1.0.3
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.3.0
