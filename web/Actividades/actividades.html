<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Actividades Diarias</title>
  <link rel="stylesheet" href="/web/Actividades/actividades.css"/>
  <link rel="stylesheet" href="/web/Actividades/menu-styles.css"/>
  <link rel="stylesheet" href="/web/menu/menu.css"/>
  <script type="module" src="/web/Actividades/actividades.js" defer></script>
  <link rel="stylesheet" href="/web/Gestion/Editar Empleado/Editar Tarea/editar.css"/>
  <script src="/web/menu/menu.js" defer></script>
</head>
<body>
  <div id="menu-container"></div>

  <div class="container">
    <!-- Header: Flechas (izquierda) + Título (centrado) + Título derecho -->
    <div class="page-header">
      <!-- Flechas de fecha (IZQUIERDA) -->
      <div id="employee-arrows-left" aria-label="Paginación de empleados">
        <button id="prev-emp-page" title="Trabajadores anteriores" aria-label="Trabajadores anteriores">&larr;</button>
        <button id="next-emp-page" title="Trabajadores siguientes" aria-label="Trabajadores siguientes">&rarr;</button>
      </div>

      <!-- Título centrado -->
      <h2 class="fade-in">Actividades Diarias</h2>

      <!-- Título derecho alineado -->
     </div>

    <!-- Gráfica debajo del header, alineada a la derecha -->
    <div class="task-progress-container">
      <section id="task-progress" class="task-progress-card compact fade-in" aria-label="Progreso de tareas">
          <h3 style="position: absolute; top: -35px; left: 50%; transform: translateX(-50%); margin: 0; font-size: 1.1rem; color: #555; font-weight: 600; white-space: nowrap;">Promedio de todos los empleados</h3>
          <div class="chart">
            <svg class="progress-ring" width="120" height="120" aria-label="Progreso de tareas">
              <!-- Pista (track) de fondo -->
              <circle class="progress-ring__track" stroke="#eeeeee" stroke-width="10"
                      fill="transparent" r="50" cx="60" cy="60"
                      stroke-dasharray="314" stroke-dashoffset="0" />
              <!-- No completadas (base roja, 100%) -->
              <circle class="progress-ring__circle not-completed"
                      fill="transparent" r="50" cx="60" cy="60"
                      stroke-dasharray="314" stroke-dashoffset="314" />
              <!-- Completadas (segmento azul) -->
              <circle class="progress-ring__circle completed"
                      fill="transparent" r="50" cx="60" cy="60"
                      stroke-dasharray="314" stroke-dashoffset="314" />
            </svg>

            <!-- Texto central -->
            <div class="chart-text">
              <div class="count" id="chartCountG">0/0</div>
              <div class="percent" id="chartPercentG">0%</div>
            </div>
          </div>

          <!-- Lateral: leyenda + separador + extras -->
          <div class="side-panel">
            <div class="legend">
              <!-- Nota: temporal - la gráfica mostrará PUNTOS cuando el backend lo soporte -->
              <div class="legend-item">
                <span class="legend-color completed"></span>
                <span class="legend-text">Total puntos ganados</span>
              </div>
              <div class="legend-item">
                <span class="legend-color not-completed"></span>
                <span class="legend-text">Puntos no ganados</span>
              </div>
            </div>

            <div class="v-sep" role="separator" aria-hidden="true"></div>

            <div class="extras-panel" title="Puntos extras obtenidos completando tareas fuera de su horario asignado">
              <div class="legend-item extras-item">
                <span class="legend-text">Puntos extras ganados</span>
              </div>
              <div class="extras-count" id="extrasCountG">0</div>
            </div>
          </div>
        </section>
    </div>

    <!-- Reloj / Día -->
    <div class="clock-container" aria-label="Reloj y selección de día">
      <div class="clock-col arrows-col">
        <button id="prev-day-btn" title="Día anterior" aria-label="Día anterior">←</button>
        <button id="today-btn" title="Regresar al día actual" aria-label="Ir a hoy">Hoy</button>
      </div>

      <div class="clock-col">
        <div class="clock-timer" id="tasks-day"></div>
      </div>

      <div class="clock-col time-col">
        <div class="clock-timer clock-hours"></div>
        <span class="clock-separator">:</span>
        <div class="clock-timer clock-minutes"></div>
        <span class="clock-separator">:</span>
        <div class="clock-timer clock-seconds"></div>
      </div>

      <div class="clock-col arrows-col">
        <button id="next-day-btn" title="Siguiente día" aria-label="Siguiente día">→</button>
      </div>
    </div>

    <!-- Tabla -->
    <div class="table-wrapper" id="table-wrapper">
      <table id="worker-table">
        <thead>
          <tr></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Modal de tarea (información) -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-task-name">Información de Tarea</h3>
        <span id="modal-close" class="modal-close">&times;</span>
      </div>
      <div class="modal-body">
        <div id="modal-task-desc"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-close-btn">Cerrar</button>
        <button id="modal-complete-btn">✓ Completar Tarea</button>
      </div>
    </div>
  </div>

  
  <div id="cell-menu" class="cell-menu hidden" role="menu" aria-hidden="true">
    <button type="button" class="menu-item" data-action="info">Información</button>
    <button type="button" class="menu-item" data-action="edit">Editar tarea</button>
  </div>

  <div id="profile-menu" class="profile-menu pm-hidden">
    <button type="button" class="menu-item" data-action="emp-create">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Crear Tarea
    </button>
    <button type="button" class="menu-item" data-action="emp-edit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      Editar Tareas
    </button>
    <button type="button" class="menu-item" data-action="emp-info">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      Ver/Editar Información
    </button>
    <button type="button" class="menu-item menu-item-delete" data-action="emp-delete">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      Eliminar Empleado
    </button>
    <button type="button" class="menu-item menu-close" data-action="close" style="background: #f8f9fa; font-weight: 600; margin-top: 8px; border-top: 2px solid #e9ecef;">Cerrar</button>
  </div>

  <!-- 🔥 Modal de PIN para acceso rápido -->
  <div id="pin-modal" class="modal hidden">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">Ingresa tu código PIN</h3>
        <span id="pin-modal-close" class="modal-close">&times;</span>
      </div>
      <div class="modal-body">
        <p style="text-align: center; margin-bottom: 20px; color: #666;">
          Ingresa tu PIN de 4 dígitos para completar la tarea
        </p>
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>
        <div class="pin-keypad">
          <button class="pin-key" data-value="1">1</button>
          <button class="pin-key" data-value="2">2</button>
          <button class="pin-key" data-value="3">3</button>
          <button class="pin-key" data-value="4">4</button>
          <button class="pin-key" data-value="5">5</button>
          <button class="pin-key" data-value="6">6</button>
          <button class="pin-key" data-value="7">7</button>
          <button class="pin-key" data-value="8">8</button>
          <button class="pin-key" data-value="9">9</button>
          <button class="pin-key pin-clear" data-value="clear">⌫</button>
          <button class="pin-key" data-value="0">0</button>
          <button class="pin-key" style="visibility: hidden;"></button>
        </div>
        <div id="pin-error" style="text-align: center; color: #dc3545; margin-top: 15px; font-size: 0.9rem; min-height: 20px;"></div>
      </div>
    </div>
  </div>

  <div id="modal-create-task" class="modal hidden"></div>
</body>
</html>
