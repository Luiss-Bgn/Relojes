<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades Diarias</title>
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"> -->
  <link rel="stylesheet" href="/web/Actividades/styles.css">
  <link rel="stylesheet" href="/web/Actividades/ui/employeeMenu.css">
  <link rel="stylesheet" href="/web/Actividades/ui/modals/crearTareaModal.css">
  <link rel="stylesheet" href="/web/Actividades/ui/modals/editarTareasModal.css">
  <link rel="stylesheet" href="/web/Actividades/ui/modals/verInfoModal.css">
  <link rel="stylesheet" href="/web/Actividades/ui/modals/verEditarTareaModal.css">
  <link rel="stylesheet" href="/web/Actividades/ui/toast.css">

  <link rel="stylesheet" href="/web/menu/menu.css">
  <script src="/web/menu/menu.js" defer></script>
</head>

<body>
  <div id="menu-container"></div>

  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">Actividades Diarias</span>
      </div>
      <div class="topbar-actions">
        <div class="connection" aria-live="polite">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-label">Sin conexión</span>
        </div>
        <button class="ghost" id="refresh-btn">Recargar</button>
      </div>
    </header>

    <section class="main-layout">
      <!-- Contenedor 1: Etiquetas de estado -->
      <div class="legend-container">
        <div class="legend" id="legend"></div>
      </div>

      <!-- Contenedor 2: Fecha y resumen del día -->
      <div class="date-container">
        <div class="date-block">
          <div style="display: flex; align-items: center; gap: 16px; justify-content: center;">
            <button class="ghost" id="prev-day-btn" style="font-size: 24px; padding: 8px 12px;">←</button>
            <h1 id="selected-date" style="min-width: 12ch; text-align: center;">--</h1>
            <button class="ghost" id="next-day-btn" style="font-size: 24px; padding: 8px 12px;">→</button>
          </div>
          <p class="muted" id="current-time">--</p>
        </div>
      </div>

      <!-- Contenedor 3: Stats/Promedio empleados -->
      <div class="stats-container">
        <div class="stats" id="stats">
          <div class="stat-card main-stat">
            <div class="stat-content">
              <div class="progress-section">
                <div id="average-progress-chart"></div>
              </div>
                <div style="display: flex; flex-direction: column; justify-content: space-between;">
                <h3 class="stat-title">Promedio de todos los empleados</h3>

                <div style="display: flex;  gap: 16px;">
                  <div class="legend-section">
                    <div class="legend-item">
                      <span class="legend-dot" style="background-color: #22c55e;"></span>
                      <span>Total puntos ganados</span>
                    </div>
                    <div class="legend-item">
                      <span class="legend-dot" style="background-color: #ef4444;"></span>
                      <span>Puntos no ganados</span>
                    </div>
                  </div>
                  <div class="extra-section">
                    <div class="stat-label">Puntos extras ganados</div>
                    <div class="stat-value" id="total-extra-points">0</div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="table-wrapper">
      <table id="panel-table">
        <thead id="panel-head"></thead>
        <tbody id="panel-body"></tbody>
      </table>
      <p class="muted" id="empty-state" hidden>Sin tareas para la fecha seleccionada.</p>
    </section>
  </main>

  <script type="module" src="/web/Actividades/actividades.js"></script>
</body>

</html>
