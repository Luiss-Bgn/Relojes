<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Informes</title>
    <link rel="stylesheet" href="/web/Informes/Informes.css">
    <link rel="stylesheet" href="/web/menu/menu.css">
    <script src="/web/menu/menu.js" defer></script>

    <script src="/web/Informes/Informes.js" type="module"></script>
    <link rel="stylesheet" href="/web/Informes/componentes/EmployeeCard.css">
    <link rel="stylesheet" href="/web/Informes/componentes/TablaPuntajes.css">
    <link rel="stylesheet" href="/web/Informes/componentes/ResumenEstadisticas.css">
    <link rel="stylesheet" href="/web/Informes/componentes/TareasVencidasInformes.css">

</head>

<body>
    <div id="menu-container"></div>

    <div class="informes-container">

        <!-- PANEL IZQUIERDO -->
        <aside class="sidebar">

            <div class="sidebar-title">
                Informes
            </div>

            <div id="sidebar-options">

                <!-- Selección por defecto -->
                <div class="sidebar-item active promedio-card" data-type="promedio">
                    <div class="promedio-icon">📊</div>
                    <div class="promedio-info">
                        <div class="promedio-titulo">Promedio de todos los empleados</div>
                        <div class="promedio-subtitulo">Vista general del equipo</div>
                    </div>
                </div>

                <!-- Aquí se insertarán empleados dinámicamente -->
                <div id="empleados-container"></div>

            </div>

        </aside>

        <!-- PANEL DERECHO -->
        <main class="content">

            <div class="content-header">
                <h2 id="content-title">Promedio de todos los empleados</h2>
                <div class="content-controls">
                    <div class="toggle-buttons">
                        <button class="toggle-btn active" data-mode="actual">Quincena Actual</button>
                        <button class="toggle-btn" data-mode="todas">Ver Todo</button>
                    </div>
                    <div id="resumen-container"></div>
                </div>
            </div>

            <!-- Componente de tareas vencidas -->
            <div id="tareas-vencidas-container"></div>

            <div id="content-body">

                <!-- Aquí se renderiza el contenido dinámico -->
                <div class="placeholder">
                    Aquí se mostrarán los informes
                </div>

            </div>

        </main>

    </div>

</body>

</html>
