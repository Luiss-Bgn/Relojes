<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="/web/Login/login.css" />
  <script src="/web/Login/login.js" defer></script>
</head>
<body>
  <!-- Chevron/volver -->
  <div class="chevron-inicio">
  <a href="/actividades" title="Ir a inicio" class="chevron-link chevron-row">
    <span class="chevron-text">Ir a inicio</span>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </a>
</div>


  <div class="container">
    <!-- Formulario de login centrado -->
    <form id="loginForm" class="form" autocomplete="on">
      <h2>Iniciar Sesión</h2>

      <!-- 🔥 NUEVO: Información de tarea pendiente -->
      <div id="taskInfo" style="display: none; background: #e3f2fd; border-left: 4px solid #2196f3; padding: 12px; margin-bottom: 16px; border-radius: 6px;">
        <p style="margin: 0; font-size: 14px; color: #1565c0; font-weight: 600;">📋 Tarea pendiente para completar:</p>
        <p id="taskDetails" style="margin: 8px 0 0 0; font-size: 13px; color: #424242;"></p>
      </div>

      <div class="flex-column">
        <label for="username">Usuario</label>
        <div class="inputForm">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2C9.79 2 8 3.79 8 6C8 8.21 9.79 10 12 10C14.21 10 16 8.21 16 6C16 3.79 14.21 2 12 2ZM12 12C8.13 12 4.85 13.57 3 16C3 18.67 3 20 12 20C21 20 21 18.67 21 16C19.15 13.57 15.87 12 12 12Z" />
          </svg>
          <input type="text" id="username" class="input" placeholder="Ingrese su usuario" required />
        </div>
      </div>

      <div class="flex-column">
        <label for="password">Contraseña</label>
        <div class="inputForm">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 11H5c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7c0-1.1-.9-2-2-2zm-7 4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm7-8h-1V5c0-2.76-2.24-5-5-5S8 2.24 8 5v2H7c-1.1 0-2 .9-2 2v2h14V9c0-1.1-.9-2-2-2zM10 5c0-1.66 1.34-3 3-3s3 1.34 3 3v2h-6V5z"/>
          </svg>
          <input type="password" id="password" class="input" placeholder="Ingrese su contraseña" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="button-submit">Ingresar</button>
      <p id="mensaje"></p>
    </form>
  </div>
</body>
</html>
